services:
  - type: web
    name: vinceauto-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: ./data
      - key: OPENCODE2_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: OPENCODE2_MODEL
        value: crouton-alpha-free
      - key: OPENCODE2_API_KEY
        sync: false
      # Single private account credentials (set in Render Dashboard, never committed to git)
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      # Google Gemini AI Studio API key (for AI Workflow Builder & Gemini AI Agent nodes)
      - key: GEMINI_API_KEY
        sync: false
      # Telegram bot token from @BotFather (can also be set inside the app)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # GitHub token with "gist" scope -> keeps workflows/published state across restarts on the free plan
      - key: GITHUB_BACKUP_TOKEN
        sync: false
